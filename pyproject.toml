[project]
name = "booking-bot"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that need a real PostgreSQL database",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "config", "migrations", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import order)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade (modern Python idioms)
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "N",   # pep8-naming
]
# Domain exceptions use NotFound/Conflict style, not *Error suffix.
ignore = ["N818"]

[tool.mypy]
python_version = "3.13"
files = ["app/domain"]
# Domain no longer imports infrastructure; silent avoids noise from third-party stubs.
follow_imports = "silent"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
pretty = true
show_error_codes = true
